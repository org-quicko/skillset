name: release-docker-snapshot

on:
  push:
    tags: ["v*-alpha*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v. No image is pushed to GHCR."
        required: true
        type: string

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.0"

concurrency:
  group: release-docker-snapshot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          case "$version" in
            [0-9]*.[0-9]*.[0-9]*-*) ;;
            *) echo "::error::'$version' is not a pre-release semantic version (expected e.g. 1.2.3-alpha.1)" && exit 1 ;;
          esac

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "skillset $version"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  ghcr:
    needs: [version, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/org-quicko/skillset:${{ needs.version.outputs.version }}
