name: release-packages

on:
  push:
    branches: [main]
    paths:
      - "apps/cli/package.json"
      - "apps/mcp/package.json"
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dir: apps/cli
            package: "@in-org-quicko/skillset-cli"
          - dir: apps/mcp
            package: "@in-org-quicko/skillset-mcp"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - run: bun install --frozen-lockfile

      # Comparing against what's actually live on npm (rather than diffing git
      # history) means a re-run, a revert, or a manual dispatch all do the
      # right thing: publish only when the local version isn't already there.
      - name: Check whether the version changed
        id: version
        run: |
          local_version=$(node -p "require('./${{ matrix.dir }}/package.json').version")
          published_version=$(npm view "${{ matrix.package }}" version 2>/dev/null || echo "none")
          echo "local $local_version, published $published_version"
          if [ "$local_version" != "$published_version" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.changed == 'true'
        run: bun run --filter "${{ matrix.package }}" build

      - name: Publish
        if: steps.version.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
