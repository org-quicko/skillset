# Standalone compose file for sqillset itself, kept separate from
# docker-compose.yml (which only provisions Postgres on db-network).
# The app gets its own (default) network, plus db-network as an external
# network so it can reach Postgres — start docker-compose.yml first so
# db-network exists.
services:
  app:
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    networks:
      - default
      - db-network

networks:
  default:
    name: sqillset-network
  db-network:
    external: true
